services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-ai
    restart: always
    ports:
      - "0.0.0.0:18789:18789"
    volumes:
      - openclaw-data:/home/node/.openclaw
    environment:
      - GATEWAY_BIND=lan
      - NODE_ENV=production
      - OPENAI_API_KEY=xxxxxxxxxxxxxxx
      - MODEL_PROVIDER=openai
      - MODEL_NAME=gpt-4o-mini
#    user: "501:20"
volumes:
  openclaw-data:
